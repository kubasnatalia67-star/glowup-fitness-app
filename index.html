<!doctype html>
<html lang="uk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="theme-color" content="#120b2f" />
    <meta
      name="description"
      content="GlowUp beta demo: fitness, nutrition, water, sleep, progress, AI coach and challenges."
    />
    <title>GlowUp Fitness App</title>
    <link rel="icon" type="image/svg+xml" href="/app-icon.svg" />
    <link rel="apple-touch-icon" href="/app-icon.svg" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <meta property="og:title" content="GlowUp Fitness App" />
    <meta property="og:description" content="Beta demo fitness dashboard with AI food scan and GlowUp progress." />
    <meta property="og:image" content="/splash.svg" />
    <script src="https://cdn.tailwindcss.com"></script>
  </head>
  <body>
    <div id="app-splash" class="app-splash" aria-label="GlowUp loading">
      <div class="splash-card">
        <img src="/app-icon.svg" alt="" class="splash-icon" />
        <div>
          <p class="splash-kicker">GlowUp beta</p>
          <h1>Preparing your dashboard</h1>
        </div>
        <div class="splash-skeleton wide"></div>
        <div class="splash-skeleton"></div>
        <div class="splash-skeleton short"></div>
      </div>
    </div>
    <noscript>GlowUp needs JavaScript enabled to run.</noscript>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
